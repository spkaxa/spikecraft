<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SpikeCraft · core</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--void:#07060f;--ln:#3b2f6b;--ln2:#5a48a8;--gr:#57d96b;--gr2:#a6f7ae;--grD:#1f7a37;--am:#ffb02e;--am2:#ffdd8a;--cy:#3fe0e8;--rd:#ff4757;--mag:#c86bff;--bl:#5aa7ff;--tx:#f4f0ff;--mu:#a99fce;--px:'Press Start 2P',monospace;--bd:'Rubik',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--void);color:var(--tx);font-family:var(--bd);user-select:none;-webkit-user-select:none}
input,select{user-select:text;-webkit-user-select:text}
::-webkit-scrollbar{width:11px;height:11px}::-webkit-scrollbar-track{background:#0b0818}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--gr),var(--grD));border:3px solid #0b0818;border-radius:7px}
*{scrollbar-width:thin;scrollbar-color:var(--grD) #0b0818}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1}
#bg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;display:none}
.sc{position:fixed;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.28s}
.sc.on{opacity:1;pointer-events:auto}
.dim{position:absolute;inset:0;background:radial-gradient(1100px 700px at 50% 28%,rgba(46,32,92,.5),rgba(6,4,14,.93) 72%)}
.wrap{position:relative;z-index:3;width:min(1020px,94vw);max-height:92vh;display:flex;flex-direction:column}
.pan{background:linear-gradient(180deg,rgba(38,29,74,.95),rgba(20,15,40,.97));border:1px solid var(--ln);border-radius:15px;box-shadow:0 26px 70px rgba(0,0,0,.65);backdrop-filter:blur(9px)}
.pad{padding:19px}
.logo{font-family:var(--px);font-size:clamp(21px,4.6vw,46px);text-align:center;line-height:1.25}
.logo .a{color:var(--gr2);text-shadow:0 3px 0 var(--grD),0 7px 0 #082a11}
.logo .b{color:var(--am2);text-shadow:0 3px 0 #a5680d,0 7px 0 #3d2503}
.spl{font-family:var(--px);font-size:11px;color:#ffe94a;text-align:center;margin:11px 0 2px;text-shadow:2px 2px 0 #4d3c00}
.btn{font-family:var(--px);font-size:12px;color:var(--tx);background:linear-gradient(180deg,#40356e,#2b2150);border:1px solid var(--ln2);border-radius:10px;padding:12px 14px;cursor:pointer;box-shadow:inset 0 2px 0 rgba(255,255,255,.13),inset 0 -4px 0 rgba(0,0,0,.4);transition:.13s;text-align:center;line-height:1.5}
.btn:hover{transform:translateY(-2px);filter:brightness(1.18)}.btn:active{transform:translateY(2px)}
.btn.pri{background:linear-gradient(180deg,#5fe076,#22a544);border-color:#96f7a8;color:#042a0d}
.btn.am{background:linear-gradient(180deg,#ffc85a,#e08c00);border-color:#ffe0a0;color:#3a2400}
.btn.dg{background:linear-gradient(180deg,#ff6b78,#c4202f);border-color:#ffa8b0;color:#fff}
.btn.gh{background:rgba(255,255,255,.05);border-color:var(--ln)}
.btn.sm{font-size:10px;padding:8px 11px}.btn:disabled{opacity:.34;pointer-events:none}
.col{display:flex;flex-direction:column;gap:9px;width:min(430px,92vw);margin:18px auto 0}
.row{display:flex;gap:9px}.row .btn{flex:1}
.credit{font-family:var(--px);font-size:9px;text-align:center;margin-top:12px;color:var(--mu)}
.credit b{color:var(--gr2)}.credit i{color:var(--am2);font-style:normal}
.foot{position:fixed;bottom:8px;left:14px;right:14px;z-index:13;display:flex;justify-content:space-between;font-size:12px;color:var(--mu);pointer-events:none;text-shadow:0 1px 3px #000}
.top{position:fixed;top:12px;right:14px;z-index:44;display:flex;gap:8px}
.ib{width:40px;height:40px;border-radius:10px;border:1px solid var(--ln2);background:rgba(32,24,64,.88);color:var(--tx);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:var(--px)}
.ib.w{width:auto;padding:0 11px;font-size:9px}
.ib:hover{filter:brightness(1.4)}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hd h2{font-family:var(--px);font-size:14px;color:var(--gr2);flex:1}
.hd .sub{font-size:13px;color:var(--mu)}
.scroll{overflow-y:auto;min-height:0}
.wg{display:grid;grid-template-columns:repeat(auto-fill,minmax(266px,1fr));gap:10px}
.wc{background:linear-gradient(180deg,#2d2358,#1d1740);border:2px solid var(--ln);border-radius:12px;padding:10px;cursor:pointer;display:flex;gap:10px}
.wc:hover{border-color:var(--ln2)}.wc.sel{border-color:var(--gr)}
.wc img{width:74px;height:74px;border-radius:8px;image-rendering:pixelated;border:1px solid var(--ln);flex:none;background:#123}
.wc h3{font-size:15px;font-weight:700;margin-bottom:3px;word-break:break-word}
.wc .mt{font-size:12px;color:var(--mu);line-height:1.5}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;margin-right:4px;background:#12294d;color:#9fcaff}
.tag.hc{background:#4d0f1a;color:#ff9fa8}.tag.cr{background:#3d2a5e;color:#dcb8ff}.tag.dd{background:#333;color:#bbb}
.empty{padding:40px;text-align:center;color:var(--mu)}.empty div{font-size:50px}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.acts .btn{flex:1;min-width:104px}
.fg{display:grid;grid-template-columns:1.05fr .95fr;gap:16px}
@media(max-width:860px){.fg{grid-template-columns:1fr}}
.fd{margin-bottom:11px}
.fd label{display:block;font-size:10px;font-family:var(--px);color:var(--mu);margin-bottom:6px}
input[type=text],input[type=number],select{width:100%;background:#100c22;border:1px solid var(--ln);border-radius:9px;color:var(--tx);padding:10px 11px;font-size:14px;font-family:var(--bd);outline:none}
input:focus,select:focus{border-color:var(--gr)}
input[type=file]{width:100%;font-size:12px;color:var(--mu);background:#100c22;border:1px dashed var(--ln2);border-radius:9px;padding:8px;cursor:pointer}
input[type=file]::file-selector-button{font-family:var(--px);font-size:9px;color:#042a0d;background:linear-gradient(180deg,#5fe076,#22a544);border:none;border-radius:7px;padding:8px 11px;margin-right:10px;cursor:pointer}
.cards{display:flex;gap:7px;flex-wrap:wrap}
.cd{flex:1;min-width:68px;background:#171233;border:2px solid var(--ln);border-radius:10px;padding:9px 6px;text-align:center;cursor:pointer}
.cd:hover{border-color:var(--ln2)}.cd.sel{border-color:var(--gr);background:#16261c}
.cd .t{font-family:var(--px);font-size:10px;margin-bottom:4px}.cd .d{font-size:11px;color:var(--mu)}
.cd.hc.sel{border-color:var(--rd);background:#2a1218}.cd.hc .t{color:var(--rd)}
input[type=range]{-webkit-appearance:none;width:100%;height:21px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:9px;background:linear-gradient(90deg,var(--grD),var(--gr));border-radius:6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-5px;background:#fff;border:2px solid #241c44;border-radius:6px}
input[type=range]::-moz-range-track{height:9px;background:linear-gradient(90deg,var(--grD),var(--gr));border-radius:6px}
input[type=range]::-moz-range-thumb{width:16px;height:16px;background:#fff;border:2px solid #241c44;border-radius:6px}
.rv{font-family:var(--px);font-size:10px;color:var(--am2);float:right}
.tg{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#171233;border:1px solid var(--ln);border-radius:9px;padding:9px 11px;cursor:pointer;margin-bottom:7px;font-size:14px}
.sw{width:41px;height:21px;background:#0b0818;border:1px solid var(--ln);border-radius:7px;position:relative;flex:none}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:15px;height:15px;background:#6d619a;border-radius:5px;transition:.15s}
.tg.on .sw{background:#123d1e}.tg.on .sw::after{left:22px;background:var(--gr)}
.sec{font-family:var(--px);font-size:10px;color:var(--cy);margin:14px 0 8px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
@media(max-width:760px){.sg{grid-template-columns:1fr}}
#prev{width:100%;border-radius:10px;border:1px solid var(--ln);image-rendering:pixelated;background:#080513}
.sum{font-size:13px;color:var(--mu);line-height:1.7;margin-top:8px}.sum b{color:var(--tx)}
.note{font-size:12px;color:var(--mu);text-align:center;margin-top:9px;line-height:1.55}
.kg{display:grid;grid-template-columns:1fr 1fr;gap:4px 15px;font-size:13px}
.kg div{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dashed #2f2559}
kbd{font-family:var(--px);font-size:8px;background:#2d2352;padding:2px 5px;border-radius:4px;border:1px solid var(--ln2)}
#load{z-index:64;background:radial-gradient(900px 600px at 50% 40%,#241c4c,#080513 78%)}
.lb{width:min(450px,90vw);text-align:center}
.bar{height:21px;background:#100c22;border:2px solid var(--ln2);border-radius:9px;overflow:hidden;margin:15px 0 8px}
.fill{height:100%;width:0;background:repeating-linear-gradient(45deg,var(--gr) 0 13px,#2fbf54 13px 26px);transition:width .2s}
.lst{font-family:var(--px);font-size:11px;color:var(--gr2)}
.lpc{font-family:var(--px);font-size:10px;color:var(--am2);margin-top:6px}
.ltp{font-size:13px;color:var(--mu);font-style:italic;margin-top:13px;min-height:40px;line-height:1.5}
#hud{position:fixed;inset:0;z-index:22;pointer-events:none;display:none}#hud.on{display:block}
#ch{position:absolute;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%);mix-blend-mode:difference}
#ch::before,#ch::after{content:'';position:absolute;background:#fff}
#ch::before{left:9px;top:0;width:2px;height:20px}#ch::after{top:9px;left:0;width:20px;height:2px}
#brk{position:absolute;left:50%;top:calc(50% + 24px);transform:translateX(-50%);width:130px;display:none;text-align:center}
#brk .b{height:8px;background:rgba(6,4,14,.8);border:1px solid #6d619a;border-radius:5px;overflow:hidden}
#brk .b i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--am),var(--gr2))}
#brk .t{font-family:var(--px);font-size:8px;margin-top:3px;text-shadow:1px 1px 0 #000}
#hb{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:4px;pointer-events:auto}
.sl{width:48px;height:48px;background:rgba(11,8,24,.82);border:2px solid #4d3f80;border-radius:8px;position:relative;cursor:pointer;flex:none}
.sl.sel{border-color:#fff;box-shadow:0 0 12px rgba(255,255,255,.5);transform:translateY(-3px)}
.sl .ic{position:absolute;inset:3px;image-rendering:pixelated;background-repeat:no-repeat}
.sl .cn{position:absolute;right:3px;bottom:1px;font-family:var(--px);font-size:9px;text-shadow:1px 1px 0 #000}
.sl .du{position:absolute;left:4px;right:4px;bottom:3px;height:3px;background:#000;border-radius:2px}
.sl .du i{display:block;height:100%;border-radius:2px}
.sl:hover{border-color:var(--gr2)}
#stl,#str{position:absolute;bottom:66px;display:flex;flex-direction:column;gap:3px}
#stl{left:calc(50% - 242px)}#str{right:calc(50% - 242px);align-items:flex-end}
.sr{display:flex;gap:1px}
.pi{width:16px;height:16px;image-rendering:pixelated;background-size:contain;background-repeat:no-repeat}
#iname{position:absolute;bottom:108px;left:50%;transform:translateX(-50%);font-family:var(--px);font-size:11px;text-shadow:2px 2px 0 #000;opacity:0;transition:.4s;text-align:center}
#clog{position:absolute;left:12px;bottom:92px;width:min(430px,60vw);display:flex;flex-direction:column;gap:3px;font-size:14px;max-height:34vh;overflow:hidden}
.cl{background:rgba(7,5,16,.66);padding:4px 9px;border-radius:6px;border-left:3px solid var(--ln2);animation:fade 12s forwards;word-break:break-word}
.cl.ok{border-color:var(--gr)}.cl.err{border-color:var(--rd);color:#ffb8be}.cl.inf{border-color:var(--bl)}
@keyframes fade{0%,86%{opacity:1}100%{opacity:0}}
#feed{position:absolute;right:14px;bottom:92px;display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:13px}
.fl{background:rgba(7,5,16,.6);padding:3px 9px;border-radius:6px;color:var(--gr2);animation:fade 3.2s forwards}
#chip{position:absolute;top:12px;left:12px;font-size:12px;background:rgba(11,8,24,.72);border:1px solid var(--ln);padding:6px 10px;border-radius:8px;color:var(--mu)}
#chip b{color:var(--gr2)}
#htr{position:absolute;top:12px;right:14px;display:flex;gap:7px;pointer-events:auto}
#hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--mu);background:rgba(7,5,16,.58);padding:6px 10px;border-radius:8px;transition:opacity 1.5s;line-height:1.6}
#svi{position:absolute;right:14px;bottom:10px;font-size:12px;color:var(--gr2);opacity:0;transition:.4s}
#hinfo{position:absolute;top:50px;right:14px;font-family:var(--px);font-size:9px;color:var(--am2);text-shadow:1px 1px 0 #000;text-align:right;line-height:1.9}
#f3{position:fixed;top:10px;left:10px;z-index:26;font-family:monospace;font-size:12px;line-height:1.45;background:rgba(5,3,12,.66);padding:8px 11px;border-radius:8px;border-left:3px solid var(--gr);display:none;white-space:pre;pointer-events:none}
.ov{position:fixed;inset:0;z-index:20;pointer-events:none;opacity:0;transition:.25s}
#ovd{background:radial-gradient(ellipse at center,transparent 38%,rgba(255,20,40,.55));transition:.1s}
#ovw{background:linear-gradient(180deg,rgba(20,84,180,.34),rgba(6,36,104,.5))}
#ovl{background:radial-gradient(ellipse at center,transparent 50%,rgba(190,0,20,.5))}
#ovl.on{animation:lp 1.15s infinite}@keyframes lp{0%,100%{opacity:.28}50%{opacity:.8}}
#ovf{background:linear-gradient(0deg,rgba(255,120,0,.7),transparent 66%)}
#gt{position:fixed;top:60px;right:14px;z-index:74;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.g{background:rgba(22,16,44,.94);border:1px solid var(--ln2);border-left:4px solid var(--gr);padding:8px 12px;border-radius:9px;font-size:13px;max-width:330px;line-height:1.45}
.g.warn{border-left-color:var(--am)}.g.err{border-left-color:var(--rd)}
#tst{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:74;display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none}
.to{background:linear-gradient(180deg,#3d3116,#241c08);border:2px solid var(--am);border-radius:11px;padding:9px 14px;display:flex;gap:10px;align-items:center;min-width:264px}
.to .i{width:32px;height:32px;image-rendering:pixelated;flex:none}
.to .t1{font-size:11px;color:var(--am2);font-weight:700}.to .t2{font-size:15px;font-weight:900}
.md{position:fixed;inset:0;z-index:58;display:none;align-items:center;justify-content:center;background:rgba(5,3,12,.76);backdrop-filter:blur(5px)}
.md.on{display:flex}.md .pan{width:min(600px,93vw);max-height:90vh;overflow:auto}
#pause .pan,#death .pan{width:min(410px,92vw)}
.ph{font-family:var(--px);font-size:14px;text-align:center;color:var(--gr2);margin-bottom:5px}
.ps{text-align:center;font-size:13px;color:var(--mu);margin-bottom:13px}
#death .dim{background:radial-gradient(ellipse at center,rgba(120,0,10,.55),rgba(50,0,5,.92))}
.dh{font-family:var(--px);font-size:18px;color:#ff6b7a;text-align:center;margin-bottom:9px}
#mapc{width:100%;border-radius:10px;border:1px solid var(--ln);background:#080513;cursor:grab;touch-action:none;display:block}
.mrow{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:8px}
.mlg{display:flex;gap:9px;flex-wrap:wrap;font-size:11px;color:var(--mu);margin-top:7px}
.mlg span{display:flex;align-items:center;gap:4px}.mdot{width:9px;height:9px;border-radius:3px;display:inline-block}
#inv{z-index:48;background:rgba(5,3,12,.64);backdrop-filter:blur(4px)}
#ip{width:min(900px,96vw);max-height:92vh;display:flex;flex-direction:column}
.ih{display:flex;align-items:center;gap:10px;padding:12px 17px 0}
.ih h3{font-family:var(--px);font-size:12px;color:var(--gr2);flex:1}
.ib2{display:flex;gap:14px;padding:12px 17px 17px;overflow-y:auto}
.il{flex:1;min-width:0}.ir{width:280px;flex:none;display:flex;flex-direction:column}
@media(max-width:840px){.ib2{flex-direction:column}.ir{width:100%}}
.ig{display:grid;grid-template-columns:repeat(9,48px);gap:4px;justify-content:center}
.ig.ar{grid-template-columns:repeat(5,48px);justify-content:flex-start}
.cw{display:flex;align-items:center;gap:11px;margin-bottom:10px;justify-content:center}
.cg{display:grid;gap:4px}.cg.c2{grid-template-columns:repeat(2,48px)}.cg.c3{grid-template-columns:repeat(3,48px)}
.ca{font-size:21px;color:var(--mu)}
.sl.rs{border-color:var(--am);background:rgba(52,40,10,.7)}
.lbl{font-size:10px;font-family:var(--px);color:var(--mu);margin:9px 0 6px}
.fr{display:flex;align-items:center;gap:13px;justify-content:center;margin:6px 0 10px}
.fc{display:flex;flex-direction:column;align-items:center;gap:5px}
.fb{width:17px;height:38px;background:#100c22;border:1px solid var(--ln);border-radius:5px;position:relative;overflow:hidden}
.fb i{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(0deg,#ff6a00,#ffd24d)}
.fa{width:50px;height:13px;background:#100c22;border:1px solid var(--ln);border-radius:5px;overflow:hidden}
.fa i{display:block;height:100%;background:linear-gradient(90deg,var(--am),#ffe98a)}
#rl{overflow-y:auto;flex:1;min-height:96px;max-height:390px;display:flex;flex-direction:column;gap:5px}
.rc{display:flex;align-items:center;gap:7px;background:#171233;border:1px solid var(--ln);border-radius:9px;padding:6px 7px;cursor:pointer}
.rc.can{border-color:#2c6036;background:#141f16}.rc.can:hover{border-color:var(--gr)}
.rc .ri{width:29px;height:29px;image-rendering:pixelated;flex:none}
.rc .rn{font-size:12px;font-weight:700}.rc .rq{font-size:10px;color:var(--mu)}
.rc .go{margin-left:auto;font-family:var(--px);font-size:8px;color:var(--gr)}
.rc:not(.can) .go{color:#555}
#ct{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}
.ct{font-size:11px;padding:5px 8px;border-radius:7px;background:#171233;border:1px solid var(--ln);cursor:pointer;color:var(--mu)}
.ct.sel{color:#042a0d;background:var(--gr);font-weight:700}
#cg{display:grid;grid-template-columns:repeat(auto-fill,48px);gap:4px;overflow-y:auto;max-height:310px;align-content:flex-start}
#cs{width:100%;margin-bottom:7px}
#cur{position:fixed;z-index:84;width:44px;height:44px;pointer-events:none;display:none;image-rendering:pixelated}
#cur .cn{position:absolute;right:0;bottom:-2px;font-family:var(--px);font-size:9px;text-shadow:1px 1px 0 #000}
#tt{position:fixed;z-index:88;background:rgba(13,9,28,.98);border:1px solid var(--ln2);border-radius:9px;padding:8px 10px;font-size:13px;pointer-events:none;display:none;max-width:240px}
#tt .d{font-size:11px;color:var(--mu);line-height:1.45}
#chw{position:fixed;left:12px;bottom:12px;z-index:50;width:min(470px,84vw);display:none}
#chi{width:100%;background:rgba(9,6,20,.96);border:2px solid var(--gr);border-radius:9px;color:var(--tx);padding:10px 12px;font-size:15px;font-family:monospace;outline:none}
.acg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.ac{display:flex;gap:9px;background:#171233;border:1px solid var(--ln);border-radius:10px;padding:9px;align-items:center}
.ac.got{border-color:#7d5c17;background:linear-gradient(180deg,#2d2411,#1d1740)}
.ac.lk{opacity:.45;filter:grayscale(.7)}
.ac .i{width:32px;height:32px;flex:none;image-rendering:pixelated}
.ac .n{font-size:13px;font-weight:700}.ac .d{font-size:11px;color:var(--mu)}
.ac.got .n{color:var(--am2)}

function normalizeGrid(grid){
var x0=3,y0=3,x1=-1,y1=-1,x,y;
for(y=0;y<3;y++)for(x=0;x<3;x++)if(grid[x+y*3]){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
if(x1<0)return null;var rows=[];
for(y=y0;y<=y1;y++){var row=[];for(x=x0;x<=x1;x++)row.push(grid[x+y*3]?grid[x+y*3].id:null);rows.push(row)}
return rows}
function keyMatches(key,id){return Array.isArray(key)?key.indexOf(id)>=0:key===id}
function findRecipe(grid){
var rows=normalizeGrid(grid);
for(var i=0;i<RECIPES.length;i++){var r=RECIPES[i];if(!ITEMS[r.out])continue;
if(r.ingredients){
var ids=[];grid.forEach(function(s){if(s)ids.push(s.id)});
if(ids.length!==r.ingredients.length)continue;
var need=r.ingredients.slice(),ok=true;
for(var j=0;j<ids.length;j++){var found=-1;
for(var q=0;q<need.length;q++)if(keyMatches(need[q],ids[j])){found=q;break}
if(found<0){ok=false;break}need.splice(found,1)}
if(ok)return r;continue}
if(!rows||!r.pattern)continue;
if(rows.length!==r.pattern.length||rows[0].length!==r.pattern[0].length)continue;
var match=true;
for(var y=0;y<rows.length&&match;y++)for(var x=0;x<rows[0].length;x++){
var ch=r.pattern[y][x],id=rows[y][x];
if(ch===' '){if(id){match=false;break}}
else if(!id||!keyMatches(r.key[ch],id)){match=false;break}}
if(match)return r}
return null}
function recipeIngredients(r){
var list=[];
if(r.ingredients)r.ingredients.forEach(function(k){list.push(Array.isArray(k)?k[0]:k)});
else r.pattern.forEach(function(row){row.split('').forEach(function(ch){
if(ch===' ')return;var k=r.key[ch];list.push(Array.isArray(k)?k[0]:k)})});
var counts={};list.forEach(function(id){counts[id]=(counts[id]||0)+1});return counts}
function canCraft(r){var need=recipeIngredients(r);for(var id in need)if(!ITEMS[id]||countItem(id)<need[id])return false;return true}
function doCraft(r,times){
var made=0;
for(var t=0;t<(times||1);t++){if(!canCraft(r))break;
var need=recipeIngredients(r);for(var id in need)consumeItem(id,need[id]);
addItem(r.out,r.count);made++;onCrafted(r.out,r.count)}
if(made)Snd.play('craft');return made}

PROF.craft+=n;
if(id==='crafting_table')award('bench');

function updateDrops(dt){
for(var i=drops.length-1;i>=0;i--){var d=drops[i];d.age+=dt;
var inWater=BLOCKS[getBlock(Math.floor(d.pos.x),Math.floor(d.pos.y),Math.floor(d.pos.z))].water;
d.vel.y-=(inWater?4:18)*dt;if(inWater)d.vel.y=Math.max(d.vel.y,-1);
d.pos.x+=d.vel.x*dt;d.pos.y+=d.vel.y*dt;d.pos.z+=d.vel.z*dt;
if(isSolid(getBlock(Math.floor(d.pos.x),Math.floor(d.pos.y-.1),Math.floor(d.pos.z)))){
d.pos.y=Math.floor(d.pos.y-.1)+1.12;d.vel.y=0;d.vel.x*=.8;d.vel.z*=.8}
var dx=Pl.pos.x-d.pos.x,dy=Pl.pos.y+.9-d.pos.y,dz=Pl.pos.z-d.pos.z,dist=Math.hypot(dx,dy,dz)||.001;
if(!Pl.dead&&!Pl.spectator&&d.age>1.5&&dist<1.8){
var left=addItem(d.stack.id,d.stack.n,d.stack.dur);
if(left<d.stack.n){showPickup(d.stack.n-left,d.stack.id);Snd.play('pick');onPickup(d.stack.id)}
if(left===0){scene.remove(d.mesh);drops.splice(i,1);continue}
d.stack.n=left}
else if(!Pl.dead&&!Pl.spectator&&d.age>1.5&&dist<3.4){
d.pos.x+=dx/dist*4*dt;d.pos.y+=dy/dist*4*dt;d.pos.z+=dz/dist*4*dt}
if(d.age>600||d.pos.y<-8){scene.remove(d.mesh);drops.splice(i,1);continue}
var light=cl(lightLevelAt(d.pos.x,d.pos.y,d.pos.z)/15,.22,1);
d.mesh.traverse(function(o){if(o.material&&o.material.color)o.material.color.setScalar(light)});
d.mesh.position.set(d.pos.x,d.pos.y+Math.sin(d.age*2+d.bobPhase)*.06,d.pos.z);
d.mesh.rotation.y+=dt*1.5}}

function getSlot(area,index){
if(area==='inv')return Pl.inv[index];

if(area==='offhand')return Pl.offhand;
if(area==='craft')return craftGrid[index];
if(area==='chest')return getContainer(invTarget,'chest').slots[index];
if(area==='furnace')return getContainer(invTarget,'furnace')[index];
return null}
function setSlot(area,index,value){
if(area==='inv')Pl.inv[index]=value;
else if(area==='armor')Pl.armor[index]=value;
else if(area==='offhand')Pl.offhand=value;
else if(area==='craft')craftGrid[index]=value;
else if(area==='chest')getContainer(invTarget,'chest').slots[index]=value;
else if(area==='furnace')getContainer(invTarget,'furnace')[index]=value}
function handleSlotClick(area,index,rightClick,shiftClick){
hideTooltip();
if(area==='creative'){
var item=ITEMS[index];if(!item)return;
if(shiftClick){addItem(item.key,item.stack,item.dur);Snd.play('pick')}
else{heldStack={id:item.key,n:item.stack};if(item.dur)heldStack.dur=item.dur;updateHeldCursor();Snd.play('click')}
renderInventory();return}
if(area==='result'){
var recipe=findRecipe(craftGrid);if(!recipe)return;
if(heldStack&&(heldStack.id!==recipe.out||heldStack.n+recipe.count>ITEMS[recipe.out].stack))return;
for(var j=0;j<9;j++)if(craftGrid[j]){craftGrid[j].n--;if(craftGrid[j].n<=0)craftGrid[j]=null}
if(heldStack)heldStack.n+=recipe.count;else heldStack={id:recipe.out,n:recipe.count};
updateHeldCursor();Snd.play('craft');onCrafted(recipe.out,recipe.count);renderInventory();return}
var current=getSlot(area,index);
if(shiftClick&&!heldStack&&current){
var item2=ITEMS[current.id];
if(area==='inv'&&item2.armorSlot!==undefined&&invMode==='inv'){
var old=Pl.armor[item2.armorSlot];Pl.armor[item2.armorSlot]=current;Pl.inv[index]=old;award('armor');checkLegend()}
else if(area==='inv'&&item2.shield&&invMode==='inv'){var oo=Pl.offhand;Pl.offhand=current;Pl.inv[index]=oo;award('shield')}
else if(area==='offhand'){var l0=addItem(current.id,current.n,current.dur);if(l0<=0)Pl.offhand=null;else current.n=l0}
else if(area==='inv'&&invMode==='chest'){
var chest=getContainer(invTarget,'chest'),n=current.n,q;
for(q=0;q<27&&n>0;q++){var s=chest.slots[q];
if(s&&s.id===current.id&&s.n<item2.stack){var take=Math.min(item2.stack-s.n,n);s.n+=take;n-=take}}
for(q=0;q<27&&n>0;q++)if(!chest.slots[q]){chest.slots[q]={id:current.id,n:n,dur:current.dur};n=0}
current.n=n;if(n<=0)Pl.inv[index]=null}

function island(cx,cy,cz,r){
var positions=[],normals=[],colors=[],indices=[];
function put(x,y,z,w,h,d,c){
var faces=[[[x,y+h,z],[x+w,y+h,z],[x,y+h,z+d],[x+w,y+h,z+d],1],
[[x+w,y,z],[x+w,y,z+d],[x+w,y+h,z],[x+w,y+h,z+d],.75],
[[x,y,z+d],[x,y,z],[x,y+h,z+d],[x,y+h,z],.75],
[[x,y,z+d],[x+w,y,z+d],[x,y+h,z+d],[x+w,y+h,z+d],.6],
[[x+w,y,z],[x,y,z],[x+w,y+h,z],[x,y+h,z],.6]];
faces.forEach(function(f){
var o=positions.length/3;
[f[0],f[1],f[2],f[3]].forEach(function(v){positions.push(v[0],v[1],v[2]);normals.push(0,1,0);
colors.push(c[0]*f[4],c[1]*f[4],c[2]*f[4])});
indices.push(o,o+1,o+2,o+2,o+1,o+3)})}
for(var dx=-r;dx<=r;dx++)for(var dz=-r;dz<=r;dz++){
var dist=Math.hypot(dx,dz);
if(dist>r+hash2(dx+cx,dz+cz)*1.5-1)continue;
var depth=Math.max(1,Math.round((r-dist)*.9+hash2(dx*3,dz*5)*2));
put(cx+dx,cy,cz+dz,1,1,1,[.35,.72,.3]);put(cx+dx,cy-depth,cz+dz,1,depth,1,[.45,.32,.2])}
for(var t=0;t<3;t++){
var tx=cx+ri(-r+2,r-2),tz=cz+ri(-r+2,r-2);
if(Math.hypot(tx-cx,tz-cz)>r-2)continue;
var th=3+ri(0,2);
put(tx,cy+1,tz,.6,th,.6,[.4,.3,.18]);put(tx-1.2,cy+th,tz-1.2,3,2.2,3,[.26,.56,.24])}
var g=new THREE.BufferGeometry();
g.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
g.setAttribute('normal',new THREE.Float32BufferAttribute(normals,3));
g.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));
g.setIndex(new THREE.Uint32BufferAttribute(indices,1));
panoScene.add(new THREE.Mesh(g,mat))}

else if(held&&ITEMS[held.id].clock){
var hours=World.time/DAY_LENGTH*24,hh=Math.floor(hours),mm=Math.floor((hours-hh)*60);
lines.push((isNight()?'☾ ':'☀ ')+String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0'))}
if(Pl.nightVision)lines.push('👁 NV');
if(Pl.mount)lines.push(Pl.mount.kind==='cart'?'🚋':'🛶');
$('hinfo').innerHTML=lines.join('<br>')}
debugTimer+=dt;if(debugTimer>.3){debugTimer=0;updateDebug()}
achTimer+=dt;if(achTimer>2){achTimer=0;
if(World.playTime>=3600)award('hour');
if(World.survivedNight&&!isNight()){award('night');World.survivedNight=false}
if(isNight())World.survivedNight=true;
checkLegend()}
saveTimer+=dt;if(saveTimer>30){saveTimer=0;saveWorld();saveProf()}}
updateParticles(dt);
rainPoints.visible=World.weather==='rain'&&SET.part>0;
if(rainPoints.visible){
var arr=rainGeo.attributes.position.array,count=SET.part===2?RAIN_N:RAIN_N/2;
for(var i=0;i<RAIN_N;i++){
if(i>=count){arr[i*3+1]=-999;continue}
arr[i*3+1]-=24*dt;
if(arr[i*3+1]<-6){arr[i*3]=rn(-32,32);arr[i*3+1]=40;arr[i*3+2]=rn(-32,32)}}
rainGeo.attributes.position.needsUpdate=true;
rainPoints.position.set(Pl.pos.x,Pl.pos.y,Pl.pos.z)}
renderer.render(scene,camera);
if(GS==='map'){mapTimer+=dt;if(mapTimer>.18){mapTimer=0;drawMap()}}}
else if(World&&['pause','settings','account'].indexOf(GS)>=0)renderer.render(scene,camera);
else{updatePanorama(dt);renderer.render(panoScene,panoCam)}}
addEventListener('resize',function(){
renderer.setSize(innerWidth,innerHeight,false);
camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
panoCam.aspect=innerWidth/innerHeight;panoCam.updateProjectionMatrix();
if(GS==='map'){var cv=$('mapc');cv.width=Math.min(780,cv.clientWidth||780);cv.height=Math.round(cv.width*.56);drawMap()}});
addEventListener('beforeunload',function(){if(World){saveWorld();saveProf()}});
document.addEventListener('pointerdown',function(){
Snd.init();if(customAudio&&customAudio.paused)customAudio.play().catch(function(){})});
/* ---------- boot ---------- */
buildPanorama();applyLanguage();renderSettings();applySettings();applyBg();applyMusic();
showMenu();renderHotbar();
console.log('%cSpikeCraft core','color:#57d96b;font-weight:bold',
'| blocks:',BLOCKS.length,'| items:',ITEM_LIST.length,'| atlas tiles:',texCount+'/4096',
'| chunk storage: Uint16Array (max id 65535)');
requestAnimationFrame(frame);
})();
</script>
