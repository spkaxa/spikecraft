<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SpikeCraft</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%234a7a35'/><rect y='5' width='16' height='11' fill='%237a5636'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--void:#08070f;--deep:#100c1e;--s1:#1a1430;--s2:#241a44;--ln:#3d2f68;--ln2:#5c48a8;
--grass:#5cc25a;--grass2:#a8ee9c;--grassD:#2a7a34;--amber:#ffae2b;--amber2:#ffdf94;
--cyan:#37dfe6;--red:#ff4a5c;--mag:#c濃;--mag:#c46bff;--blue:#5b9dff;--lava:#ff7a1a;
--tx:#f5f1ff;--mu:#a89dc6;--px:'Press Start 2P',monospace;--bd:'Rubik',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--void);color:var(--tx);font-family:var(--bd);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
input,select{user-select:text;-webkit-user-select:text}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:#0c0918;border-left:1px solid #251d44}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--grass),var(--grassD));border:3px solid #0c0918;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,var(--grass2),var(--grass))}
::-webkit-scrollbar-corner{background:#0c0918}
*{scrollbar-width:thin;scrollbar-color:var(--grassD) #0c0918}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1}
#menubg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;display:none}
.sc{position:fixed;inset:0;z-index:14;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transform:translateY(12px);transition:.3s cubic-bezier(.2,.8,.3,1)}
.sc.on{opacity:1;pointer-events:auto;transform:none}
.veil{position:absolute;inset:0;background:radial-gradient(1200px 780px at 50% 24%,rgba(52,36,104,.5),rgba(6,4,14,.93) 70%)}
.wrap{position:relative;z-index:3;width:min(1040px,94vw);max-height:93vh;display:flex;flex-direction:column}
.panel{background:linear-gradient(180deg,rgba(40,30,78,.95),rgba(20,15,40,.97));border:1px solid var(--ln);border-radius:16px;box-shadow:0 28px 76px rgba(0,0,0,.68),inset 0 1px 0 rgba(255,255,255,.07);backdrop-filter:blur(10px)}
.pad{padding:20px}
.logo{font-family:var(--px);font-size:clamp(22px,4.7vw,48px);text-align:center;line-height:1.26;animation:float 6s ease-in-out infinite}
.logo .g{color:var(--grass2);text-shadow:0 3px 0 var(--grassD),0 7px 0 #0b2c11,0 0 34px rgba(92,194,90,.35)}
.logo .a{color:var(--amber2);text-shadow:0 3px 0 #a56a0c,0 7px 0 #3d2503,0 0 34px rgba(255,174,43,.3)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.splash{font-family:var(--px);font-size:11px;color:#ffe94a;text-align:center;margin:12px 0 3px;animation:sp 1.2s ease-in-out infinite;text-shadow:2px 2px 0 #4d3c00}
@keyframes sp{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(-3deg) scale(1.07)}}
.btn{font-family:var(--px);font-size:12px;color:var(--tx);background:linear-gradient(180deg,#42366f,#2c2152);border:1px solid var(--ln2);border-radius:11px;padding:13px 15px;cursor:pointer;position:relative;box-shadow:inset 0 2px 0 rgba(255,255,255,.14),inset 0 -4px 0 rgba(0,0,0,.42),0 5px 14px rgba(0,0,0,.3);transition:.13s;text-align:center;line-height:1.5}
.btn:hover{transform:translateY(-2px);filter:brightness(1.2)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 2px 7px rgba(0,0,0,.5)}
.btn.go{background:linear-gradient(180deg,#63e07a,#25a747);border-color:#9bf7ac;color:#052a0e}
.btn.am{background:linear-gradient(180deg,#ffc85c,#e08d00);border-color:#ffe2a4;color:#3a2400}
.btn.dg{background:linear-gradient(180deg,#ff6d7c,#c4212f);border-color:#ffaab2;color:#fff}
.btn.pu{background:linear-gradient(180deg,#c46bff,#7b34d6);border-color:#e0b2ff;color:#fff}
.btn.gh{background:rgba(255,255,255,.055);border-color:var(--ln)}
.btn.sm{font-size:10px;padding:8px 11px}
.btn:disabled{opacity:.33;pointer-events:none}
.col{display:flex;flex-direction:column;gap:10px;width:min(440px,92vw);margin:20px auto 0}
.row{display:flex;gap:10px}.row .btn{flex:1}
.stag>*{opacity:0;transform:translateY(14px)}
.on .stag>*{animation:rise .5s cubic-bezier(.2,.9,.3,1.25) forwards}
.on .stag>*:nth-child(2){animation-delay:.07s}.on .stag>*:nth-child(3){animation-delay:.14s}.on .stag>*:nth-child(4){animation-delay:.21s}
@keyframes rise{to{opacity:1;transform:none}}
.credit{font-family:var(--px);font-size:9px;text-align:center;margin-top:14px;color:var(--mu)}
.credit b{color:var(--grass2)}.credit i{color:var(--amber2);font-style:normal}
.foot{position:fixed;bottom:8px;left:15px;right:15px;z-index:15;display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--mu);pointer-events:none;text-shadow:0 1px 4px #000}
.top{position:fixed;top:12px;right:14px;z-index:46;display:flex;gap:8px}
.ib{width:41px;height:41px;border-radius:11px;border:1px solid var(--ln2);background:rgba(34,25,66,.9);color:var(--tx);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.14s;font-family:var(--px)}
.ib:hover{filter:brightness(1.45);transform:translateY(-2px)}
.ib.w{width:auto;padding:0 12px;font-size:9px}
.hd{display:flex;align-items:center;gap:11px;margin-bottom:13px}
.hd h2{font-family:var(--px);font-size:14px;color:var(--grass2);flex:1;text-shadow:0 2px 0 #0b2c11}
.hd .sub{font-size:13px;color:var(--mu)}
.scroll{overflow-y:auto;min-height:0}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:11px}
.wcard{background:linear-gradient(180deg,#2e2459,#1e1842);border:2px solid var(--ln);border-radius:13px;padding:11px;cursor:pointer;display:flex;gap:11px;transition:.14s}
.wcard:hover{transform:translateY(-3px);border-color:var(--ln2)}
.wcard.sel{border-color:var(--grass);box-shadow:0 0 0 2px rgba(92,194,90,.25)}
.wcard img{width:76px;height:76px;border-radius:9px;image-rendering:pixelated;border:1px solid var(--ln);flex:none;background:#123}
.wcard h3{font-size:15px;font-weight:700;margin-bottom:3px;word-break:break-word}
.wcard .meta{font-size:12px;color:var(--mu);line-height:1.5}
.chip{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;margin-right:4px;background:#122a4f;color:#9ccaff}
.chip.hc{background:#4d0f1a;color:#ff9fa8}.chip.cr{background:#3d2a5e;color:#dcb8ff}.chip.dd{background:#333;color:#bbb}
.empty{padding:44px 20px;text-align:center;color:var(--mu)}.empty div{font-size:52px;animation:float 4s infinite}
.acts{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}.acts .btn{flex:1;min-width:106px}
.fgrid{display:grid;grid-template-columns:1.06fr .94fr;gap:17px}
@media(max-width:880px){.fgrid{grid-template-columns:1fr}}
.fd{margin-bottom:12px}
.fd label{display:block;font-size:10px;font-family:var(--px);color:var(--mu);margin-bottom:6px}
input[type=text],input[type=number],select{width:100%;background:#110d24;border:1px solid var(--ln);border-radius:9px;color:var(--tx);padding:10px 12px;font-size:14px;font-family:var(--bd);outline:none;transition:.14s}
input:focus,select:focus{border-color:var(--grass);box-shadow:0 0 0 3px rgba(92,194,90,.14)}
input[type=file]{width:100%;font-size:12px;color:var(--mu);background:#110d24;border:1px dashed var(--ln2);border-radius:9px;padding:8px;cursor:pointer}
input[type=file]::file-selector-button{font-family:var(--px);font-size:9px;color:#052a0e;background:linear-gradient(180deg,#63e07a,#25a747);border:none;border-radius:7px;padding:8px 11px;margin-right:10px;cursor:pointer}
.cards{display:flex;gap:7px;flex-wrap:wrap}
.cd{flex:1;min-width:70px;background:#1a1436;border:2px solid var(--ln);border-radius:10px;padding:9px 6px;text-align:center;cursor:pointer;transition:.13s}
.cd:hover{border-color:var(--ln2);transform:translateY(-2px)}
.cd.sel{border-color:var(--grass);background:#16281c}
.cd .t{font-family:var(--px);font-size:10px;margin-bottom:4px}.cd .d{font-size:11px;color:var(--mu)}
.cd.hc.sel{border-color:var(--red);background:#2a1218}.cd.hc .t{color:var(--red)}
input[type=range]{-webkit-appearance:none;width:100%;height:22px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:9px;background:linear-gradient(90deg,var(--grassD),var(--grass));border-radius:6px;border:1px solid #0b2c11}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:19px;height:19px;margin-top:-5px;background:linear-gradient(180deg,#fff,#d2c9ec);border:2px solid #241c44;border-radius:6px}
input[type=range]::-moz-range-track{height:9px;background:linear-gradient(90deg,var(--grassD),var(--grass));border-radius:6px}
input[type=range]::-moz-range-thumb{width:17px;height:17px;background:#fff;border:2px solid #241c44;border-radius:6px}
.rv{font-family:var(--px);font-size:10px;color:var(--amber2);float:right}
.tg{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#1a1436;border:1px solid var(--ln);border-radius:9px;padding:9px 12px;cursor:pointer;margin-bottom:7px;font-size:14px}
.tg:hover{border-color:var(--ln2)}
.sw{width:42px;height:22px;background:#0c0918;border:1px solid var(--ln);border-radius:7px;position:relative;flex:none;transition:.15s}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;background:#6f639c;border-radius:5px;transition:.15s}
.tg.on .sw{background:#123d1e;border-color:var(--grassD)}.tg.on .sw::after{left:22px;background:var(--grass);box-shadow:0 0 8px rgba(92,194,90,.7)}
.sec{font-family:var(--px);font-size:10px;color:var(--cyan);margin:15px 0 8px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
@media(max-width:780px){.sgrid{grid-template-columns:1fr}}
#preview{width:100%;border-radius:10px;border:1px solid var(--ln);image-rendering:pixelated;background:#080513}
.sum{font-size:13px;color:var(--mu);line-height:1.7;margin-top:8px}.sum b{color:var(--tx)}
.note{font-size:12px;color:var(--mu);text-align:center;margin-top:9px;line-height:1.55}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:13px}
.keys div{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dashed #2f2559}
kbd{font-family:var(--px);font-size:8px;background:#2e2453;padding:2px 5px;border-radius:4px;border:1px solid var(--ln2)}
#load{z-index:66;background:radial-gradient(900px 620px at 50% 40%,#251d4e,#080513 78%)}
.lbox{width:min(460px,90vw);text-align:center}
.bar{height:22px;background:#110d24;border:2px solid var(--ln2);border-radius:9px;overflow:hidden;margin:16px 0 9px}
.fill{height:100%;width:0;background:repeating-linear-gradient(45deg,var(--grass) 0 14px,#33c05a 14px 28px);transition:width .2s}
.lstage{font-family:var(--px);font-size:11px;color:var(--grass2)}
.lpct{font-family:var(--px);font-size:10px;color:var(--amber2);margin-top:6px}
.ltip{font-size:13px;color:var(--mu);font-style:italic;margin-top:14px;min-height:42px;line-height:1.5}
#hud{position:fixed;inset:0;z-index:24;pointer-events:none;display:none}#hud.on{display:block}
#cross{position:absolute;left:50%;top:50%;width:21px;height:21px;transform:translate(-50%,-50%);mix-blend-mode:difference}
#cross::before,#cross::after{content:'';position:absolute;background:#fff}
#cross::before{left:9.5px;top:0;width:2px;height:21px}#cross::after{top:9.5px;left:0;width:21px;height:2px}
#brk{position:absolute;left:50%;top:calc(50% + 25px);transform:translateX(-50%);width:132px;display:none;text-align:center}
#brk .b{height:8px;background:rgba(6,4,14,.82);border:1px solid #6f639c;border-radius:5px;overflow:hidden}
#brk .b i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--grass2))}
#brk .t{font-family:var(--px);font-size:8px;margin-top:3px;text-shadow:1px 1px 0 #000}
#boss{position:absolute;top:56px;left:50%;transform:translateX(-50%);width:min(470px,82vw);display:none;text-align:center}
#boss .n{font-family:var(--px);font-size:10px;color:#e8bcff;text-shadow:2px 2px 0 #000;margin-bottom:5px}
#boss .b{height:12px;background:rgba(6,4,14,.82);border:1px solid var(--mag);border-radius:6px;overflow:hidden}
#boss .b i{display:block;height:100%;background:linear-gradient(90deg,var(--mag),#ff7ae0);transition:width .2s}
#hot{position:absolute;bottom:11px;left:50%;transform:translateX(-50%);display:flex;gap:4px;pointer-events:auto}
.slot{width:48px;height:48px;background:rgba(11,8,24,.84);border:2px solid #4f4183;border-radius:8px;position:relative;cursor:pointer;flex:none;box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
.slot.sel{border-color:#fff;box-shadow:0 0 13px rgba(255,255,255,.55);transform:translateY(-3px)}
.slot .ic{position:absolute;inset:3px;image-rendering:pixelated;background-repeat:no-repeat}
.slot .n{position:absolute;right:3px;bottom:1px;font-family:var(--px);font-size:9px;text-shadow:1px 1px 0 #000}
.slot .du{position:absolute;left:4px;right:4px;bottom:3px;height:3px;background:#000;border-radius:2px}
.slot .du i{display:block;height:100%;border-radius:2px}
.slot:hover{border-color:var(--grass2)}
#statL,#statR{position:absolute;bottom:67px;display:flex;flex-direction:column;gap:3px}
#statL{left:calc(50% - 242px)}#statR{right:calc(50% - 242px);align-items:flex-end}
.srow{display:flex;gap:1px}
.pip{width:16px;height:16px;image-rendering:pixelated;background-size:contain;background-repeat:no-repeat}
.pip.shk{animation:shk .3s}@keyframes shk{25%{transform:translateY(-3px)}75%{transform:translateY(2px)}}
#itemname{position:absolute;bottom:110px;left:50%;transform:translateX(-50%);font-family:var(--px);font-size:11px;text-shadow:2px 2px 0 #000;opacity:0;transition:.4s;text-align:center}
#log{position:absolute;left:12px;bottom:94px;width:min(430px,60vw);display:flex;flex-direction:column;gap:3px;font-size:14px;max-height:34vh;overflow:hidden}
.line{background:rgba(7,5,16,.66);padding:4px 9px;border-radius:6px;border-left:3px solid var(--ln2);animation:fadeout 12s forwards;word-break:break-word}
.line.ok{border-color:var(--grass)}.line.err{border-color:var(--red);color:#ffb8be}.line.inf{border-color:var(--blue)}.line.ep{border-color:var(--mag);color:#e8c8ff}
@keyframes fadeout{0%,86%{opacity:1}100%{opacity:0}}
#feed{position:absolute;right:14px;bottom:94px;display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:13px}
.fitem{background:rgba(7,5,16,.62);padding:3px 9px;border-radius:6px;color:var(--grass2);animation:fadeout 3.2s forwards}
#badge{position:absolute;top:12px;left:12px;font-size:12px;background:rgba(11,8,24,.74);border:1px solid var(--ln);padding:6px 11px;border-radius:8px;color:var(--mu)}
#badge b{color:var(--grass2)}
#hudtop{position:absolute;top:12px;right:14px;display:flex;gap:7px;pointer-events:auto}
#hint{position:absolute;left:12px;bottom:11px;font-size:12px;color:var(--mu);background:rgba(7,5,16,.58);padding:6px 10px;border-radius:8px;transition:opacity 1.5s;line-height:1.6}
#saved{position:absolute;right:14px;bottom:11px;font-size:12px;color:var(--grass2);opacity:0;transition:.4s}
#info{position:absolute;top:52px;right:14px;font-family:var(--px);font-size:9px;color:var(--amber2);text-shadow:1px 1px 0 #000;text-align:right;line-height:1.95}
#debug{position:fixed;top:10px;left:10px;z-index:27;font-family:monospace;font-size:12px;line-height:1.45;background:rgba(5,3,12,.68);padding:8px 11px;border-radius:8px;border-left:3px solid var(--grass);display:none;white-space:pre;pointer-events:none}
.ov{position:fixed;inset:0;z-index:22;pointer-events:none;opacity:0;transition:.25s}
#ovDmg{background:radial-gradient(ellipse at center,transparent 36%,rgba(255,20,40,.55));transition:.1s}
#ovWater{background:linear-gradient(180deg,rgba(20,84,180,.34),rgba(6,36,104,.5))}
#ovLow{background:radial-gradient(ellipse at center,transparent 48%,rgba(190,0,20,.5))}
#ovLow.on{animation:pulse 1.15s infinite}@keyframes pulse{0%,100%{opacity:.26}50%{opacity:.8}}
#ovFire{background:linear-gradient(0deg,rgba(255,120,0,.72),transparent 66%)}
#ovNether{background:radial-gradient(ellipse at center,transparent 40%,rgba(150,30,10,.28))}
#ovEnd{background:radial-gradient(ellipse at center,transparent 45%,rgba(90,40,150,.22))}
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:76;display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none}
.toast{background:linear-gradient(180deg,#3e3218,#241c08);border:2px solid var(--amber);border-radius:12px;padding:9px 15px;display:flex;gap:10px;align-items:center;min-width:268px;animation:pop .42s cubic-bezier(.2,1.3,.3,1);box-shadow:0 14px 34px rgba(0,0,0,.6)}
.toast .i{width:32px;height:32px;image-rendering:pixelated;flex:none}
.toast .t1{font-size:11px;color:var(--amber2);font-weight:700}.toast .t2{font-size:15px;font-weight:900}
.toast.big{border-color:#fff;animation:pop .42s,glow 1.2s infinite}
@keyframes glow{0%,100%{box-shadow:0 0 26px rgba(196,107,255,.8)}50%{box-shadow:0 0 44px rgba(255,174,43,.9)}}
@keyframes pop{from{opacity:0;transform:translateY(-30px) scale(.9)}to{opacity:1;transform:none}}
.toast.out{transition:.4s;opacity:0;transform:translateY(-18px)}
#notes{position:fixed;top:62px;right:14px;z-index:76;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.note2{background:rgba(23,17,46,.95);border:1px solid var(--ln2);border-left:4px solid var(--grass);padding:8px 12px;border-radius:9px;font-size:13px;max-width:330px;line-height:1.45;animation:pop .3s}
.note2.warn{border-left-color:var(--amber)}.note2.err{border-left-color:var(--red)}
#pause .panel,#death .panel,#win .panel{width:min(430px,92vw)}
.ph{font-family:var(--px);font-size:14px;text-align:center;color:var(--grass2);margin-bottom:5px}
.ps{text-align:center;font-size:13px;color:var(--mu);margin-bottom:14px}
#death .veil{background:radial-gradient(ellipse at center,rgba(120,0,10,.56),rgba(50,0,5,.93))}
#win .veil{background:radial-gradient(ellipse at center,rgba(90,40,150,.5),rgba(20,6,40,.94))}
.dh{font-family:var(--px);font-size:18px;color:#ff6d7c;text-align:center;text-shadow:0 4px 0 #4d0510;margin-bottom:10px}
.wh{font-family:var(--px);font-size:17px;color:#e8bcff;text-align:center;text-shadow:0 4px 0 #3a1060;margin-bottom:10px;line-height:1.5}
.md{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(5,3,12,.78);backdrop-filter:blur(6px)}
.md.on{display:flex}.md .panel{width:min(600px,93vw);max-height:90vh;overflow:auto}
#mapc{width:100%;border-radius:10px;border:1px solid var(--ln);background:#080513;cursor:grab;touch-action:none;display:block}
.mrow{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:8px}
.mlg{display:flex;gap:9px;flex-wrap:wrap;font-size:11px;color:var(--mu);margin-top:7px}
.mlg span{display:flex;align-items:center;gap:4px}.dot{width:9px;height:9px;border-radius:3px;display:inline-block}
#inv{z-index:50;background:rgba(5,3,12,.66);backdrop-filter:blur(5px)}
#ipanel{width:min(910px,96vw);max-height:93vh;display:flex;flex-direction:column}
.ih{display:flex;align-items:center;gap:10px;padding:13px 18px 0}
.ih h3{font-family:var(--px);font-size:12px;color:var(--grass2);flex:1}
.ibody{display:flex;gap:15px;padding:13px 18px 18px;overflow-y:auto}
.ileft{flex:1;min-width:0}.iright{width:284px;flex:none;display:flex;flex-direction:column}
@media(max-width:850px){.ibody{flex-direction:column}.iright{width:100%}}

var SLAB_FAMILIES=[

var SLAB_BASE={},STAIR_BASE={};

SLAB_DIRS.forEach(function(d){

block(key,fam[1]+'ая плита',fam[2]+' Slab',{cube:false,hard:src.hard,tool:src.tool,tier:src.tier||0,

for(var face=0;face<4;face++)for(var up=0;up<2;up++){

function item(key,ru,en,opt){ITEMS[key]=Object.assign({key:key,ru:ru,en:en,stack:64,cat:'misc'},opt||{});ITEM_LIST.push(ITEMS[key]);return ITEMS[key]}

if(b.bedPart==='head')return;

function addItem(id,n,dur){
var it=ITEMS[id];if(!it)return n;
var max=it.stack,i;
if(max>1)for(i=0;i<36&&n>0;i++){
var s=P.inv[i];
if(s&&s.id===id&&s.n<max){var take=Math.min(max-s.n,n);s.n+=take;n-=take}}
for(i=0;i<36&&n>0;i++)if(!P.inv[i]){
var t=Math.min(max,n);P.inv[i]={id:id,n:t};if(dur!==undefined)P.inv[i].dur=dur;n-=t}
renderHotbar();if(invMode)renderInventory();updateHand();
return n}
function countItem(id){var n=0;P.inv.forEach(function(s){if(s&&s.id===id)n+=s.n});return n}
function consumeItem(id,n){
for(var i=0;i<36&&n>0;i++){
var s=P.inv[i];
if(s&&s.id===id){var take=Math.min(s.n,n);s.n-=take;n-=take;if(s.n<=0)P.inv[i]=null}}
renderHotbar();if(invMode)renderInventory()}

{type:type,input:null,fuel:null,output:null,burn:0,burnMax:1,prog:0};
containers.set(k,c)}
return c}

containers.delete(x+','+y+','+z)}
var FUEL={coal:80,charcoal:80,stick:5,lava_bucket:800,crafting_table:15,chest:15,coal_block:800,bookshelf:15,hay:5};
WOODS.forEach(function(w){FUEL[w.key+'_planks']=15;FUEL[w.key+'_log']=15});
FUEL.crimson_planks=15;FUEL.warped_planks=15;FUEL.crimson_stem=15;FUEL.warped_stem=15;

function updateFurnaces(dt){
containers.forEach(function(c,k){
if(c.type!=='furnace')return;
var pp=k.split(','),x=+pp[0],y=+pp[1],z=+pp[2];
var can=c.input&&SMELT[c.input.id]&&(!c.output||(c.output.id===SMELT[c.input.id]&&c.output.n<64));
if(c.burn>0){
c.burn-=dt;
if(can){c.prog+=dt;
if(c.prog>=7){c.prog=0;var out=SMELT[c.input.id];
c.input.n--;if(c.input.n<=0)c.input=null;
if(c.output)c.output.n++;else c.output={id:out,n:1};
award('smelt');
if(invMode==='furnace'&&invTarget&&contKey(invTarget)===k)renderInventory()}}
else c.prog=Math.max(0,c.prog-dt*2)}
else{c.prog=Math.max(0,c.prog-dt*2);
if(can&&c.fuel&&FUEL[c.fuel.id]){
c.burnMax=FUEL[c.fuel.id];c.burn=c.burnMax;
var wasLava=c.fuel.id==='lava_bucket';
c.fuel.n--;if(c.fuel.n<=0)c.fuel=wasLava?{id:'bucket',n:1}:null}}
var id=getBlock(x,y,z);

function normGrid(grid){
var x0=3,y0=3,x1=-1,y1=-1,x,y;
for(y=0;y<3;y++)for(x=0;x<3;x++)if(grid[x+y*3]){
if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
if(x1<0)return null;
var rows=[];
for(y=y0;y<=y1;y++){var row=[];for(x=x0;x<=x1;x++)row.push(grid[x+y*3]?grid[x+y*3].id:null);rows.push(row)}
return rows}
function keyMatch(key,id){return Array.isArray(key)?key.indexOf(id)>=0:key===id}
function findRecipe(grid){
var rows=normGrid(grid);
for(var i=0;i<RECIPES.length;i++){
var r=RECIPES[i];if(!ITEMS[r.out])continue;
if(r.ingredients){
var ids=[];grid.forEach(function(s){if(s)ids.push(s.id)});
if(ids.length!==r.ingredients.length)continue;
var need=r.ingredients.slice(),ok=true;
for(var j=0;j<ids.length;j++){
var found=-1;
for(var q=0;q<need.length;q++)if(keyMatch(need[q],ids[j])){found=q;break}
if(found<0){ok=false;break}
need.splice(found,1)}
if(ok)return r;continue}
if(!rows||!r.pattern)continue;
if(rows.length!==r.pattern.length||rows[0].length!==r.pattern[0].length)continue;
var match=true;
for(var y=0;y<rows.length&&match;y++)for(var x=0;x<rows[0].length;x++){
var ch=r.pattern[y][x],id=rows[y][x];
if(ch===' '){if(id){match=false;break}}
else if(!id||!keyMatch(r.key[ch],id)){match=false;break}}
if(match)return r}
return null}
function ingredients(r){
var list=[];
if(r.ingredients)r.ingredients.forEach(function(k){list.push(Array.isArray(k)?k[0]:k)});
else r.pattern.forEach(function(row){row.split('').forEach(function(ch){
if(ch===' ')return;var k=r.key[ch];list.push(Array.isArray(k)?k[0]:k)})});
var counts={};list.forEach(function(id){counts[id]=(counts[id]||0)+1});
return counts}
function canCraft(r){
var need=ingredients(r);
for(var id in need)if(!ITEMS[id]||countItem(id)<need[id])return false;
return true}
function doCraft(r,times){
var made=0;
for(var t=0;t<(times||1);t++){
if(!canCraft(r))break;
var need=ingredients(r);

if(made)Audio2.play('craft');
return made}

function tryLightPortal(t){
var x=t.x,z=t.z,found=false;
for(var ax=-4;ax<=4&&!found;ax++)for(var az=-4;az<=4&&!found;az++)for(var axis=0;axis<2;axis++){
var w=0,h=0,i;
for(i=1;i<=4;i++){
var vx=x+ax+(axis?0:i),vz=z+az+(axis?i:0);
if(getBlock(vx,t.y,vz)!==BID.obsidian)break;w=i}
if(w<2)continue;
for(i=1;i<=5;i++){if(getBlock(x+ax,t.y+i,z+az)!==BID.obsidian)break;h=i}
if(h<3)continue;
var good=true;
for(var jj=1;jj<=h&&good;jj++)for(var ii=1;ii<=w;ii++){
var cx2=x+ax+(axis?0:ii),cz2=z+az+(axis?ii:0);
var cid=getBlock(cx2,t.y+jj,cz2);
if(cid!==BID.air&&cid!==BID.nether_portal&&cid!==BID.fire)good=false}
if(!good)continue;
for(var j2=1;j2<=h;j2++)for(var i2=1;i2<=w;i2++)
setBlock(x+ax+(axis?0:i2),t.y+j2,z+az+(axis?i2:0),BID.nether_portal,true);
found=true}
if(found){
Audio2.play('portal');notify(L('🌀 Портал в ад открыт!','🌀 Nether portal lit!'),'ep');award('portal');

function getSlot(area,index){
if(area==='inv')return P.inv[index];
if(area==='armor')return P.armor[index];
if(area==='offhand')return P.offhand;
if(area==='craft')return craftGrid[index];
if(area==='chest')return getContainer(invTarget,'chest').slots[index];
if(area==='furnace')return getContainer(invTarget,'furnace')[index];
return null}
function setSlot(area,index,value){
if(area==='inv')P.inv[index]=value;
else if(area==='armor')P.armor[index]=value;
else if(area==='offhand')P.offhand=value;
else if(area==='craft')craftGrid[index]=value;
else if(area==='chest')getContainer(invTarget,'chest').slots[index]=value;
else if(area==='furnace')getContainer(invTarget,'furnace')[index]=value}
function slotClick(area,index,right,shift){
hideTip();
if(area==='creative'){
var it=ITEMS[index];if(!it)return;
if(shift){addItem(it.key,it.stack,it.dur);Audio2.play('pickup')}
else{heldStack={id:it.key,n:it.stack};if(it.dur)heldStack.dur=it.dur;updateHeld();Audio2.play('click')}
renderInventory();return}
if(area==='result'){
var recipe=findRecipe(craftGrid);if(!recipe)return;
if(heldStack&&(heldStack.id!==recipe.out||heldStack.n+recipe.count>ITEMS[recipe.out].stack))return;
for(var j=0;j<9;j++)if(craftGrid[j]){craftGrid[j].n--;if(craftGrid[j].n<=0)craftGrid[j]=null}
if(heldStack)heldStack.n+=recipe.count;else heldStack={id:recipe.out,n:recipe.count};
updateHeld();Audio2.play('craft');onCraft(recipe.out,recipe.count);renderInventory();return}
var cur=getSlot(area,index);
if(shift&&!heldStack&&cur){
var item=ITEMS[cur.id];
if(area==='inv'&&item.armorSlot!==undefined&&invMode==='inv'){
var old=P.armor[item.armorSlot];P.armor[item.armorSlot]=cur;P.inv[index]=old;award('armor');checkLegend()}
else if(area==='inv'&&item.shield&&invMode==='inv'){
var oo=P.offhand;P.offhand=cur;P.inv[index]=oo;award('shield')}
else if(area==='offhand'){var l0=addItem(cur.id,cur.n,cur.dur);if(l0<=0)P.offhand=null;else cur.n=l0}
else if(area==='inv'&&invMode==='chest'){
var chest=getContainer(invTarget,'chest'),n=cur.n,q;
for(q=0;q<27&&n>0;q++){var s=chest.slots[q];
if(s&&s.id===cur.id&&s.n<item.stack){var take=Math.min(item.stack-s.n,n);s.n+=take;n-=take}}
for(q=0;q<27&&n>0;q++)if(!chest.slots[q]){chest.slots[q]={id:cur.id,n:n,dur:cur.dur};n=0}
cur.n=n;if(n<=0)P.inv[index]=null}
else if(area==='chest'){var left=addItem(cur.id,cur.n,cur.dur);if(left<=0)setSlot(area,index,null);else cur.n=left}
else if(area==='inv'&&invMode==='furnace'){
var fur=getContainer(invTarget,'furnace');
var dest=SMELT[cur.id]?'input':FUEL[cur.id]?'fuel':null;
if(dest){
if(!fur[dest]){fur[dest]=cur;P.inv[index]=null}
else if(fur[dest].id===cur.id){
var t2=Math.min(item.stack-fur[dest].n,cur.n);fur[dest].n+=t2;cur.n-=t2;
if(cur.n<=0)P.inv[index]=null}}}
else if(area==='inv'){
var range=index<9?[9,36]:[0,9],n2=cur.n,q2;

function buildMapImage(){

for(var z=0;z<N;z++)for(var x=0;x<N;x++){
var wx=Math.min(SIZE-1,Math.floor(x*step)),wz=Math.min(SIZE-1,Math.floor(z*step));
var h=heightAt(wx,wz),b=biomeAt2(wx,wz),col;
if(DIMENSION===2&&h<=0)col=[10,6,18];
else if(DIMENSION===0&&h<SEA){
var depth=clamp((SEA-h)/26,0,1);
col=[26+46*(1-depth),74+62*(1-depth),150+70*(1-depth)]}
else{
var base=BIOMES[b].grass,f=clamp(0.72+(h-SEA)/Math.max(1,MOUNT)*0.75,0.6,1.32);
var hx=heightAt(Math.min(SIZE-1,wx+ss),wz),slope=clamp((h-hx)/5,-1,1),m=1+slope*0.3;
col=[base[0]*f*m,base[1]*f*m,base[2]*f*m]}
var i=(z*N+x)*4;
data[i]=clamp(col[0],0,255);data[i+1]=clamp(col[1],0,255);data[i+2]=clamp(col[2],0,255);data[i+3]=255}
ctx.putImageData(img,0,0)}

function randomTick(){
var pcx=Math.floor(P.x/16),pcz=Math.floor(P.z/16);
for(var i=0;i<6;i++){
var c=chunks.get(ck(pcx+randInt(-3,3),pcz+randInt(-3,3)));if(!c)continue;
for(var j=0;j<5;j++){
var lx=randInt(0,15),lz=randInt(0,15),x=c.cx*16+lx,z=c.cz*16+lz;
var h=heightAt(x,z),y=randInt(Math.max(1,h-2),Math.min(WHEIGHT-2,h+4));
var id=c.data[lx+lz*16+y*256],b=BLOCKS[id];if(!b)continue;
if(b.crop&&b.stage<3&&Math.random()<0.3)setBlock(x,y,z,BID[b.crop+'_crop_'+(b.stage+1)],true);
else if(b.grows&&Math.random()<0.1)growTree(x,y,z,b.grows);
else if(b.chorusTop&&Math.random()<0.05)growChorus(x,y,z);
else if(b.cane&&Math.random()<0.22){
var top=y;while(BLOCKS[getBlock(x,top+1,z)].cane)top++;
if(top-y<2&&getBlock(x,top+1,z)===BID.air)setBlock(x,top+1,z,BID.sugar_cane,true)}
else if(id===BID.dirt&&Math.random()<0.12&&getBlock(x,y+1,z)===BID.air){
var DS=[[1,0],[-1,0],[0,1],[0,-1]];
for(var q=0;q<4;q++)if(getBlock(x+DS[q][0],y,z+DS[q][1])===BID.grass){setBlock(x,y,z,BID.grass,true);break}}
else if(b.lava&&Math.random()<0.1){
if(getBlock(x,y-1,z)===BID.air)setBlock(x,y-1,z,BID.lava,true);
else{var D2=[[1,0],[-1,0],[0,1],[0,-1]];
for(var q2=0;q2<4;q2++){var nx=x+D2[q2][0],nz=z+D2[q2][1];
if(getBlock(nx,y,nz)===BID.air&&isSolid(getBlock(nx,y-1,nz))&&h3(nx,y,nz)<0.4){setBlock(nx,y,nz,BID.lava,true);break}}}}
else if(b.water&&Math.random()<0.08){
if(getBlock(x,y-1,z)===BID.air)setBlock(x,y-1,z,BID.water,true);
else{var D3=[[1,0],[-1,0],[0,1],[0,-1]];
for(var q3=0;q3<4;q3++){var nx2=x+D3[q3][0],nz2=z+D3[q3][1];
if(getBlock(nx2,y,nz2)===BID.air&&isSolid(getBlock(nx2,y-1,nz2))){setBlock(nx2,y,nz2,BID.water,true);break}}}}}}}

var cv=$('preview'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
var oldSeed=SEED,oldPreset=PRESET,oldSea=SEA,oldMount=MOUNT,oldH=WHEIGHT,oldDim=DIMENSION;
var parsed=parseSeed();
DIMENSION=0;SEED=parsed.seed;seedNoise(parsed.seed);PRESET=parsed.preset;
SEA=createOpts.sea;MOUNT=createOpts.mount;WHEIGHT=Math.min(140,SEA+MOUNT+22);
columnCache.clear();
function yOf(y){return H-8-(y/WHEIGHT)*(H-16)}
ctx.fillStyle='#080513';ctx.fillRect(0,0,W,H);
var grad=ctx.createLinearGradient(0,0,0,yOf(SEA));
grad.addColorStop(0,'#1a2a5e');grad.addColorStop(1,'#4a7ac0');
ctx.fillStyle=grad;ctx.fillRect(0,0,W,yOf(SEA));
for(var q=0;q<W;q+=2){
var wx=Math.floor(q/W*512),h=terrainHeight(wx,256),b=biomeAt(wx,256,h),yy=yOf(h);
ctx.fillStyle=h<SEA?'#2a5fd0':sh(BIOMES[b].grass,1);
ctx.fillRect(q,yy,2,H-8-yy);
if(h<SEA){ctx.fillStyle='rgba(60,120,230,.8)';ctx.fillRect(q,yOf(SEA),2,yy-yOf(SEA))}}
ctx.fillStyle='#3a3a40';ctx.fillRect(0,H-8,W,8);
ctx.strokeStyle='#37dfe6';ctx.setLineDash([5,4]);ctx.beginPath();
ctx.moveTo(0,yOf(SEA));ctx.lineTo(W,yOf(SEA));ctx.stroke();ctx.setLineDash([]);
ctx.fillStyle='#37dfe6';ctx.font='10px Rubik';ctx.fillText(L('море Y=','sea Y=')+SEA,6,yOf(SEA)-5);
ctx.fillStyle='#ffdf94';ctx.fillText(L('горы до Y=','peaks Y=')+(SEA+MOUNT),6,12);
SEED=oldSeed;seedNoise(oldSeed);PRESET=oldPreset;SEA=oldSea;MOUNT=oldMount;WHEIGHT=oldH;DIMENSION=oldDim;
columnCache.clear();
$('cSum').innerHTML=L('Мир ','World ')+'<b>'+createOpts.size+'²</b> · '+L('море ','sea ')+'<b>'+SEA+
'</b> · '+L('горы до ','peaks ')+'<b>Y='+(SEA+MOUNT)+'</b>'+
(parsed.preset?'<br>'+L('Пресет: ','Preset: ')+'<b style="color:var(--amber2)">'+parsed.preset.toUpperCase()+'</b>':'')+
'<br>'+L('Генерация: ','Generation: ')+'<b>'+(createOpts.size<=512?'~1s':createOpts.size<=2048?'~3s':'~5s')+'</b> · '+
createOpts.difficulty.toUpperCase()+
(createOpts.difficulty==='hardcore'?'<br><span style="color:var(--red)">⚠ '+L('Одна жизнь, без команд','One life, no commands')+'</span>':'')}

['bottom','top','north','south','west','east'][P.slabRot]+' slab'));return}
if(e.code==='F3'){debugOn=!debugOn;$('debug').style.display=debugOn?'block':'none';return}
if(e.code==='F1'){$('hud').classList.toggle('on');return}
if(e.code==='F2'){
renderer.render(scene,camera);
var a=document.createElement('a');
a.download='spikecraft_'+Date.now()+'.png';
a.href=canvas.toDataURL('image/png');a.click();notify('📸');return}
if(e.code==='KeyN'){toggleMute();return}
if(e.repeat)return;
if(e.code==='KeyF'){toggleFly();return}
if(e.code==='Space'){
var now=performance.now();
if(now-lastSpace<300&&!P.mount)toggleFly();
lastSpace=now;return}
if(e.code==='KeyW'){
var n2=performance.now();
if(n2-lastW<300)touchSprint=true;
lastW=n2;return}
if(e.code==='KeyQ'){
var st=P.inv[P.sel];
if(st){
var count=e.ctrlKey?st.n:1,d=lookDir();
spawnDrop(P.x+d.x*1.2,P.y+1.35,P.z+d.z*1.2,{id:st.id,n:count,dur:st.dur},d.x*6,1.6,d.z*6);
st.n-=count;if(st.n<=0)P.inv[P.sel]=null;
renderHotbar();updateHand()}return}
if(e.code.indexOf('Digit')===0){
var digit=+e.code.slice(5);
if(digit>=1&&digit<=9)selectSlot(digit-1)}},true);
document.addEventListener('keyup',function(e){
keys[e.code]=false;
if(e.code==='KeyW')touchSprint=false},true);
function toggleFly(){
if(P.creative||P.flyAllowed||P.spectator){
if(P.spectator){notify(L('В наблюдателе полёт всегда включён','Spectator always flies'));return}
P.fly=!P.fly;P.vy=0;
notify(P.fly?L('🕊 Полёт включён','🕊 Flight on'):L('Полёт выключен','Flight off'));
if(!P.creative&&P.fly)markCheats()}
else notify(L('Полёт: креатив или /fly','Flight: creative or /fly'),'warn')}
document.addEventListener('mousemove',function(e){
if(!WORLD){panoMouse.x=(e.clientX/innerWidth-0.5)*2;panoMouse.y=(e.clientY/innerHeight-0.5)*2;return}
if(SCREEN!=='game')return;
if(document.pointerLockElement!==canvas&&!lockFallback)return;
var sens=0.0022*(CFG.sens/100);
P.yaw-=e.movementX*sens;
P.pitch=clamp(P.pitch-e.movementY*sens*(CFG.invert?-1:1),-1.55,1.55)});
document.addEventListener('mousedown',function(e){
if(SCREEN!=='game')return;
if(e.target.closest('.ib')||e.target.closest('#hot'))return;
if(e.button===0){mouseL=true;P.swing=Math.max(P.swing,0.4)}
if(e.button===2){mouseR=true;useCd=0}
if(e.button===1){
e.preventDefault();
var t=P.target;
if(t&&P.creative){
var key=BLOCKS[t.id].key;
if(ITEMS[key]&&!ITEMS[key].hidden){P.inv[P.sel]={id:key,n:64};renderHotbar();updateHand()}}}});
document.addEventListener('mouseup',function(e){
if(e.button===0)mouseL=false;
if(e.button===2)mouseR=false});
document.addEventListener('contextmenu',function(e){if(WORLD)e.preventDefault()});
document.addEventListener('wheel',function(e){
if(SCREEN!=='game')return;
e.preventDefault();
if(P.zoom){P.zoomF=clamp(P.zoomF*(e.deltaY>0?1.12:0.89),0.12,1);return}
selectSlot((P.sel+(e.deltaY>0?1:-1)+9)%9)},{passive:false});
if(IS_TOUCH){
var joy=$('stick'),nub=joy.querySelector('.nub'),jid=null,lid=null,ll=null,tmode='break';
joy.addEventListener('pointerdown',function(e){jid=e.pointerId;joy.setPointerCapture(e.pointerId)});
joy.addEventListener('pointermove',function(e){
if(e.pointerId!==jid)return;
var r=joy.getBoundingClientRect();
var dx=(e.clientX-r.left-59)/44,dy=(e.clientY-r.top-59)/44,l=Math.hypot(dx,dy);
if(l>1){dx/=l;dy/=l}
touchMove.x=dx;touchMove.y=dy;
nub.style.left=(39+dx*34)+'px';nub.style.top=(39+dy*34)+'px';
touchSprint=l>0.92});
var je=function(e){
if(e.pointerId!==jid)return;
jid=null;touchMove.x=touchMove.y=0;touchSprint=false;
nub.style.left='39px';nub.style.top='39px'};
joy.addEventListener('pointerup',je);joy.addEventListener('pointercancel',je);
var look=$('look');
look.addEventListener('pointerdown',function(e){
lid=e.pointerId;ll={x:e.clientX,y:e.clientY};look.setPointerCapture(e.pointerId);
if(tmode==='break')mouseL=true;else{mouseR=true;useCd=0}});
look.addEventListener('pointermove',function(e){
if(e.pointerId!==lid||!ll)return;
var s=0.005*(CFG.sens/100);
P.yaw-=(e.clientX-ll.x)*s;
P.pitch=clamp(P.pitch-(e.clientY-ll.y)*s*(CFG.invert?-1:1),-1.55,1.55);
ll={x:e.clientX,y:e.clientY}});
var le=function(e){if(e.pointerId!==lid)return;lid=null;mouseL=false;mouseR=false};
look.addEventListener('pointerup',le);look.addEventListener('pointercancel',le);
$('tJump').addEventListener('pointerdown',function(e){e.preventDefault();touchJump=true});
$('tJump').addEventListener('pointerup',function(){touchJump=false});
$('tFly').addEventListener('click',toggleFly);
$('tMode').addEventListener('click',function(){
tmode=tmode==='break'?'place':'break';
$('tMode').textContent=tmode==='break'?'⛏':'🧱'});
$('tInv').addEventListener('click',function(){if(SCREEN==='game')openInventory(P.creative?'creative':'inv')});
$('tMap').addEventListener('click',function(){if(SCREEN==='game')openMap()});
$('tChat').addEventListener('click',function(){if(SCREEN==='game')openChat('')});
$('tPause').addEventListener('click',function(){if(SCREEN==='game')pauseGame()});
CFG.auto=true}
/* ══════════ main loop ══════════ */
var lastFrame=performance.now();
var saveT=0,tickT=0,spawnT=0,hudT=0,dbgT=0,achT=0,streamT=0,mapT=0,fireT=0,ambientT=0;
function frame(now){
requestAnimationFrame(frame);
var dt=Math.min(0.05,(now-lastFrame)/1000);lastFrame=now;
frameCount++;fpsAccum+=dt;
if(fpsAccum>=1){fps=frameCount;frameCount=0;fpsAccum=0}
if(WORLD&&['game','inv','chat','death','map','win'].indexOf(SCREEN)>=0){
if(SCREEN!=='map'&&SCREEN!=='win'){
WORLD.playTime+=dt;PROFILE.time+=dt;
if(SCREEN==='game'||SCREEN==='chat')updatePlayer(dt);
if(SCREEN==='game'){updateInteraction(dt);portalTick(dt)}
mobs.slice().forEach(function(m){updateMob(m,dt)});
updateRides(dt);updateDrops(dt);updateProjectiles(dt);updateTNT(dt);updateLeafDecay(dt);
updateSky(dt);updateDragon(dt);
fireT+=dt;if(fireT>0.5){fireT=0;updateFires(0.5)}
tickT+=dt;if(tickT>0.6){tickT=0;randomTick()}
updateFurnaces(dt);
spawnT+=dt;if(spawnT>2.4){spawnT=0;trySpawnMobs()}
streamT+=dt;if(streamT>0.35){streamT=0;streamChunks()}
processQueues(SCREEN==='game'?4:2.5);
ambientT+=dt;
if(ambientT>6){
ambientT=0;
if(DIMENSION===0&&P.y<heightAt(clamp(P.x|0,0,SIZE-1),clamp(P.z|0,0,SIZE-1))-8&&Math.random()<0.5)
Audio2.play('drip',null,{x:P.x+rand(-8,8),y:P.y,z:P.z+rand(-8,8)})}
hudT+=dt;
if(hudT>0.15){
hudT=0;updateHud();
if(invMode==='furnace'&&invTarget){
var c=containers.get(contKey(invTarget));
if(c){
var bEl=$('fBurn'),pEl=$('fProg');
if(bEl)bEl.style.height=(c.burnMax?c.burn/c.burnMax*100:0)+'%';
if(pEl)pEl.style.width=(c.prog/7*100)+'%'}}
var lines=[],held=P.inv[P.sel];
if(held&&ITEMS[held.id].compass){
var dx=WORLD.spawn[0]-P.x,dz=WORLD.spawn[2]-P.z;
lines.push('⌖ '+L('спавн ','spawn ')+Math.round(Math.hypot(dx,dz))+'m')}
else if(held&&ITEMS[held.id].clock){
var hours=WORLD.time/DAY_LENGTH*24,hh=Math.floor(hours),mm=Math.floor((hours-hh)*60);
lines.push((isNight()?'☾ ':'☀ ')+String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0'))}
if(P.nightVision)lines.push('👁 NV');
if(P.mount)lines.push(P.mount.kind==='cart'?'🚋':'🛶');
if(DIMENSION===2)lines.push('🛡 '+aliveCrystals());
$('info').innerHTML=lines.join('<br>')}
dbgT+=dt;if(dbgT>0.3){dbgT=0;updateDebug()}
achT+=dt;
if(achT>2){
achT=0;
if(WORLD.playTime>=3600)award('hour');
if(isNight())WORLD.nightSeen=true;
if(WORLD.nightSeen&&!isNight()&&DIMENSION===0){award('night');WORLD.nightSeen=false}
checkLegend()}
saveT+=dt;if(saveT>30){saveT=0;saveWorld();saveProfile()}}
updateParticles(dt);
rainPoints.visible=WORLD.weather==='rain'&&CFG.part>0&&DIMENSION===0;
if(rainPoints.visible){
var arr=rainGeo.attributes.position.array,count=CFG.part===2?RAIN_N:RAIN_N/2;
for(var i=0;i<RAIN_N;i++){
if(i>=count){arr[i*3+1]=-999;continue}
arr[i*3+1]-=24*dt;
if(arr[i*3+1]<-6){arr[i*3]=rand(-30,30);arr[i*3+1]=40;arr[i*3+2]=rand(-30,30)}}
rainGeo.attributes.position.needsUpdate=true;
rainPoints.position.set(P.x,P.y,P.z)}
renderer.render(scene,camera);
if(SCREEN==='map'){mapT+=dt;if(mapT>0.18){mapT=0;drawMap()}}}
else if(WORLD&&['pause','settings','account'].indexOf(SCREEN)>=0)renderer.render(scene,camera);
else{updatePanorama(dt);renderer.render(panoScene,panoCam)}}
addEventListener('resize',function(){
renderer.setSize(innerWidth,innerHeight,false);
camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
panoCam.aspect=innerWidth/innerHeight;panoCam.updateProjectionMatrix();
if(SCREEN==='map'){
var cv=$('mapc');cv.width=Math.min(790,cv.clientWidth||790);cv.height=Math.round(cv.width*0.56);drawMap()}});
addEventListener('beforeunload',function(){if(WORLD){saveWorld();saveProfile()}});
document.addEventListener('pointerdown',function(){
Audio2.init();
if(customAudio&&customAudio.paused)customAudio.play().catch(function(){})});
/* ══════════ boot ══════════ */
buildPanorama();
applyLanguage();
renderSettings();
applySettings();
applyBackground();
applyMusic();
showMenu();
renderHotbar();
console.log('%cSpikeCraft','color:#5cc25a;font-weight:bold;font-size:14px',
'| blocks:',BLOCKS.length,'| items:',ITEM_LIST.length,
'| atlas tiles:',texIndex+'/1024','| icons:',iconCount+'/1024',
'| chunk storage: Uint16Array','| LOD layers: 0 (no z-fighting)');
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
